<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480">
  <defs>
    <linearGradient id="podTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ff"/>
    </linearGradient>
    <linearGradient id="podSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ff"/><stop offset="1" stop-color="#4e5bff"/>
    </linearGradient>
    <radialGradient id="podGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff3c4"/><stop offset=".45" stop-color="#ffc93c"/><stop offset="1" stop-color="#c47f00"/>
    </radialGradient>
    <linearGradient id="coinEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d99e10"/><stop offset="1" stop-color="#9a6300"/>
    </linearGradient>
  </defs>

  <!-- glow behind -->
  <ellipse cx="280" cy="250" rx="250" ry="210" fill="url(#podGlow)"/>

  <!-- podium -->
  <ellipse cx="280" cy="418" rx="236" ry="40" fill="#000a6e" opacity=".35"/>
  <path d="M50 380 L50 404 A230 46 0 0 0 510 404 L510 380 Z" fill="url(#podSide)"/>
  <ellipse cx="280" cy="380" rx="230" ry="46" fill="url(#podTop)"/>
  <ellipse cx="280" cy="380" rx="196" ry="34" fill="none" stroke="#c7cdfa" stroke-width="2" opacity=".8"/>
  <ellipse cx="200" cy="364" rx="70" ry="9" fill="#fff" opacity=".7"/>

  <!-- connection arc -->
  <path d="M150 170 Q280 40 410 170" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round" opacity=".85"/>

  <!-- characters -->
