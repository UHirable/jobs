  <rect x="124" y="196" width="22" height="66" rx="11" fill="url(#pants)"/>
  <ellipse cx="102" cy="263" rx="17" ry="8" fill="#0d1240"/>
  <ellipse cx="140" cy="263" rx="17" ry="8" fill="#0d1240"/>
  <ellipse cx="97" cy="259" rx="6" ry="2.4" fill="#fff" opacity=".35"/>
  <ellipse cx="135" cy="259" rx="6" ry="2.4" fill="#fff" opacity=".35"/>

  <!-- torso -->
  <rect x="72" y="116" width="96" height="98" rx="38" fill="url(#suit)"/>
  <ellipse cx="96" cy="136" rx="14" ry="8" fill="#fff" opacity=".22"/>
  <!-- shirt + tie -->
  <path d="M104 118 L136 118 L120 162 Z" fill="#fff"/>
  <path d="M116 124 L124 124 L127 154 L120 164 L113 154 Z" fill="url(#gold)"/>
  <path d="M116 124 L124 124 L122 131 L118 131 Z" fill="#d99e10"/>
  <!-- lapels -->
