  <ellipse cx="108" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <ellipse cx="132" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <circle cx="109.3" cy="80.4" r="1.3" fill="#fff"/>
  <circle cx="133.3" cy="80.4" r="1.3" fill="#fff"/>
  <path d="M102 73 q6 -4 12 -1" stroke="#2b1b17" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M126 72 q6 -3 12 1" stroke="#2b1b17" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <circle cx="101" cy="93" r="5" fill="#ff7a7a" opacity=".3"/>
  <circle cx="139" cy="93" r="5" fill="#ff7a7a" opacity=".3"/>
  <path d="M110 95 Q120 104 130 95" stroke="#7a2a1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="106" cy="62" rx="9" ry="5" fill="#fff" opacity=".25"/>
</g>
  <g transform="translate(286 106)">
