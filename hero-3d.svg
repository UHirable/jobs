      <stop offset="0" stop-color="#3a49ff"/><stop offset=".5" stop-color="#0112ff"/><stop offset="1" stop-color="#00087a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3eff"/><stop offset="1" stop-color="#000ca8"/>
