<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <defs>
    <radialGradient id="skin2" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#f6d2b4"/><stop offset=".5" stop-color="#d9976c"/><stop offset="1" stop-color="#9f5b37"/>
    </radialGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe59a"/><stop offset=".5" stop-color="#ffc93c"/><stop offset="1" stop-color="#c98600"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd767"/><stop offset="1" stop-color="#d99e10"/>
    </linearGradient>
    <linearGradient id="jeans" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8bff"/><stop offset="1" stop-color="#3a47d6"/>
    </linearGradient>
    <radialGradient id="hair2" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#6b3d24"/><stop offset="1" stop-color="#2a140a"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe3ff"/>
    </linearGradient>
    <radialGradient id="glass" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset=".4" stop-color="#bfe0ff" stop-opacity=".55"/><stop offset="1" stop-color="#6f86ff" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a9b2ff"/>
    </linearGradient>
  </defs>

  <ellipse cx="116" cy="268" rx="64" ry="9" fill="#000" opacity=".28"/>

  <!-- hair back -->
  <circle cx="116" cy="82" r="42" fill="url(#hair2)"/>
  <path d="M78 90 Q74 128 92 140 L140 140 Q158 128 154 90 Z" fill="url(#hair2)"/>

  <!-- legs + shoes -->
  <rect x="90" y="196" width="22" height="66" rx="11" fill="url(#jeans)"/>
  <rect x="120" y="196" width="22" height="66" rx="11" fill="url(#jeans)"/>
  <ellipse cx="98" cy="263" rx="17" ry="8" fill="#ffffff"/>
  <ellipse cx="136" cy="263" rx="17" ry="8" fill="#ffffff"/>
  <ellipse cx="98" cy="266" rx="17" ry="4" fill="#c7cdf5"/>
  <ellipse cx="136" cy="266" rx="17" ry="4" fill="#c7cdf5"/>

  <!-- hoodie torso -->
  <rect x="68" y="116" width="96" height="98" rx="38" fill="url(#hoodie)"/>
  <path d="M96 118 Q116 140 136 118" stroke="#d99e10" stroke-width="6" fill="none" stroke-linecap="round"/>
  <line x1="108" y1="128" x2="106" y2="150" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="124" y1="128" x2="126" y2="150" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <rect x="94" y="176" width="44" height="24" rx="10" fill="#d99e10" opacity=".45"/>
  <ellipse cx="90" cy="136" rx="13" ry="8" fill="#fff" opacity=".3"/>

  <!-- left arm holding resume -->
  <path d="M78 132 Q60 150 66 174" stroke="url(#sleeve)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <!-- resume -->
  <g transform="rotate(-8 64 190)">
    <rect x="30" y="150" width="70" height="88" rx="9" fill="#9aa3ff" transform="translate(3 5)"/>
    <rect x="30" y="150" width="70" height="88" rx="9" fill="url(#paper)"/>
    <rect x="39" y="160" width="20" height="22" rx="5" fill="#0112ff"/>
    <circle cx="49" cy="167" r="4.5" fill="#f6d2b4"/>
    <path d="M42 182 q7 -9 14 0" fill="#ffc93c"/>
    <rect x="64" y="163" width="28" height="5" rx="2.5" fill="#0112ff"/>
    <rect x="64" y="173" width="20" height="4" rx="2" fill="#b3baf5"/>
    <rect x="39" y="192" width="52" height="4" rx="2" fill="#c9cef7"/>
    <rect x="39" y="202" width="44" height="4" rx="2" fill="#c9cef7"/>
    <rect x="39" y="212" width="50" height="4" rx="2" fill="#c9cef7"/>
    <path d="M39 224 l4 4 8 -8" stroke="#12b76a" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="56" y="222" width="30" height="4" rx="2" fill="#c9cef7"/>
  </g>
  <circle cx="68" cy="178" r="11" fill="url(#skin2)"/>

  <!-- right arm raised with magnifier -->
  <path d="M154 132 Q176 124 182 104" stroke="url(#sleeve)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <line x1="186" y1="98" x2="196" y2="80" stroke="#0d1240" stroke-width="9" stroke-linecap="round"/>
  <circle cx="206" cy="58" r="24" fill="url(#glass)" stroke="url(#ring)" stroke-width="8"/>
  <path d="M194 50 q6 -10 16 -8" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".9"/>
  <circle cx="183" cy="102" r="11" fill="url(#skin2)"/>

  <!-- neck -->
  <rect x="106" y="100" width="20" height="22" rx="8" fill="#b56f47"/>

  <!-- head -->
  <circle cx="116" cy="78" r="33" fill="url(#skin2)"/>
  <!-- fringe -->
  <path d="M83 80 Q80 42 118 42 Q152 42 150 76 Q142 58 120 56 Q100 68 83 80 Z" fill="url(#hair2)"/>
  <circle cx="116" cy="38" r="14" fill="url(#hair2)"/>
  <ellipse cx="110" cy="33" rx="6" ry="3" fill="#fff" opacity=".2"/>
  <!-- face -->
  <ellipse cx="104" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <ellipse cx="128" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <circle cx="105.3" cy="80.4" r="1.3" fill="#fff"/>
  <circle cx="129.3" cy="80.4" r="1.3" fill="#fff"/>
  <path d="M99 77 l-3 -2 M133 77 l3 -2" stroke="#1a1240" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="97" cy="93" r="5" fill="#ff6b8a" opacity=".35"/>
  <circle cx="135" cy="93" r="5" fill="#ff6b8a" opacity=".35"/>
  <path d="M107 94 Q116 104 125 94 Q116 99 107 94 Z" fill="#7a2a1c"/>
  <ellipse cx="102" cy="64" rx="8" ry="4.5" fill="#fff" opacity=".22"/>

  <!-- sparkles -->
  <path d="M30 70 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" fill="#ffc93c"/>
  <path d="M190 150 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#fff" opacity=".8"/>
</svg>
