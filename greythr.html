  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(500px 400px at 80% 15%,rgba(120,140,255,.5),transparent 70%),linear-gradient(160deg,#0a14a8,#0112ff 60%,#0a1fff)}
    .box{width:100%;max-width:460px;text-align:center}
    .logo{height:40px;margin-bottom:28px}
    .card{background:#fff;color:#050b3f;border-radius:24px;padding:28px 24px;box-shadow:0 30px 60px -28px rgba(0,0,0,.5)}

    h1{font-size:1.3rem;margin-bottom:6px}
    p{color:#4a5280;font-size:.95rem;line-height:1.5}
    .deal{margin:18px 0;background:linear-gradient(135deg,#0fbf6a,#08a35a 55%,#067a44);color:#fff;border-radius:16px;padding:14px;font-weight:800;font-size:1.4rem}
    .deal small{display:block;font-size:.85rem;font-weight:600;margin-top:2px}
    .btn{display:block;width:100%;border:0;cursor:pointer;text-decoration:none;font:inherit;font-weight:800;padding:14px;border-radius:14px;margin-top:10px}
    .go{background:#ffc93c;color:#050505;box-shadow:0 6px 0 #c99a1c}
    .cp{background:#eef0ff;color:#0112ff}
    .hint{margin-top:14px;font-size:.82rem}
    #st{display:block;min-height:1.2em;margin-top:8px;font-size:.85rem;color:#08a35a;font-weight:700}

<body>
  <div class="box">
    <img class="logo" src="logo-white.webp" width="618" height="110" alt="U Hirable">
    <div class="card">
      <img class="gl" src="greythr-wordmark.png" alt="greytHR">

      <div class="deal">10% OFF<small>annual plans + a free account to start</small></div>
      <a class="btn go" id="go" href="https://greythr.referralrock.com/l/AMELMOUSSA04/" rel="noreferrer">Continue to greytHR →</a>
      <button class="btn cp" id="cp" type="button">Copy link</button>
      <small id="st" role="status"></small>
      <p class="hint">Page not opening on desktop? Copy the link and paste it into a new browser tab.</p>
    </div>
  </div>
  <script>
    var DEST="https://greythr.referralrock.com/l/AMELMOUSSA04/";
    document.getElementById("cp").addEventListener("click",function(){
      var s=document.getElementById("st");
      if(navigator.clipboard){navigator.clipboard.writeText(DEST).then(function(){s.textContent="Link copied! Paste it in a new tab.";},function(){s.textContent=DEST;});}
      else{s.textContent=DEST;}
    });
    try{ if(!sessionStorage.getItem("gr_seen")){ sessionStorage.setItem("gr_seen","1"); setTimeout(function(){location.href=DEST;},900); } }catch(e){ setTimeout(function(){location.href=DEST;},900); }
  </script>
</body>
