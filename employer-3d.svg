<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280">
  <defs>
    <radialGradient id="skin" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffe6d4"/><stop offset=".5" stop-color="#f4b48c"/><stop offset="1" stop-color="#c6784f"/>
    </radialGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a49ff"/><stop offset=".5" stop-color="#0112ff"/><stop offset="1" stop-color="#00087a"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3eff"/><stop offset="1" stop-color="#000ca8"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2266"/><stop offset="1" stop-color="#050b3f"/>
    </linearGradient>
    <radialGradient id="hair" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#5a3a2c"/><stop offset="1" stop-color="#1a0e0a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".55" stop-color="#ffc93c"/><stop offset="1" stop-color="#cf8f00"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e7ff"/>
    </linearGradient>
    <linearGradient id="signEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9c0ff"/><stop offset="1" stop-color="#8a94f5"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="120" cy="268" rx="66" ry="9" fill="#050b3f" opacity=".18"/>

  <!-- legs + shoes -->
  <rect x="94" y="196" width="22" height="66" rx="11" fill="url(#pants)"/>
  <rect x="124" y="196" width="22" height="66" rx="11" fill="url(#pants)"/>
  <ellipse cx="102" cy="263" rx="17" ry="8" fill="#0d1240"/>
  <ellipse cx="140" cy="263" rx="17" ry="8" fill="#0d1240"/>
  <ellipse cx="97" cy="259" rx="6" ry="2.4" fill="#fff" opacity=".35"/>
  <ellipse cx="135" cy="259" rx="6" ry="2.4" fill="#fff" opacity=".35"/>

  <!-- torso -->
  <rect x="72" y="116" width="96" height="98" rx="38" fill="url(#suit)"/>
  <ellipse cx="96" cy="136" rx="14" ry="8" fill="#fff" opacity=".22"/>
  <!-- shirt + tie -->
  <path d="M104 118 L136 118 L120 162 Z" fill="#fff"/>
  <path d="M116 124 L124 124 L127 154 L120 164 L113 154 Z" fill="url(#gold)"/>
  <path d="M116 124 L124 124 L122 131 L118 131 Z" fill="#d99e10"/>
  <!-- lapels -->
  <path d="M104 118 L120 162 L108 150 L96 124 Z" fill="#000a9e" opacity=".55"/>
  <path d="M136 118 L120 162 L132 150 L144 124 Z" fill="#000a9e" opacity=".55"/>

  <!-- arms -->
  <path d="M82 132 Q66 148 70 168" stroke="url(#arm)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M158 132 Q174 148 170 168" stroke="url(#arm)" stroke-width="22" stroke-linecap="round" fill="none"/>

  <!-- hiring sign -->
  <rect x="50" y="156" width="140" height="70" rx="16" fill="url(#signEdge)" transform="translate(0 6)"/>
  <rect x="50" y="156" width="140" height="70" rx="16" fill="url(#sign)"/>
  <rect x="58" y="161" width="62" height="6" rx="3" fill="#fff" opacity=".9"/>
  <text x="120" y="190" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="17" fill="#0112ff" letter-spacing=".5">WE'RE</text>
  <text x="120" y="211" text-anchor="middle" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="800" font-size="17" fill="#0112ff" letter-spacing=".5">HIRING!</text>
  <circle cx="172" cy="174" r="7" fill="url(#gold)"/>
  <path d="M172 169.5 l1.4 2.9 3.2.4-2.3 2.2.6 3.2-2.9-1.5-2.9 1.5.6-3.2-2.3-2.2 3.2-.4z" fill="#fff" opacity=".9"/>

  <!-- hands -->
  <circle cx="64" cy="172" r="11" fill="url(#skin)"/>
  <circle cx="176" cy="172" r="11" fill="url(#skin)"/>

  <!-- neck -->
  <rect x="110" y="100" width="20" height="22" rx="8" fill="#d98e64"/>

  <!-- head -->
  <circle cx="87" cy="84" r="7.5" fill="url(#skin)"/>
  <circle cx="153" cy="84" r="7.5" fill="url(#skin)"/>
  <circle cx="120" cy="78" r="34" fill="url(#skin)"/>
  <!-- hair -->
  <path d="M86 78 Q84 40 120 40 Q158 40 154 78 Q150 58 128 56 Q112 66 92 64 Q88 70 86 78 Z" fill="url(#hair)"/>
  <ellipse cx="108" cy="50" rx="10" ry="4" fill="#fff" opacity=".18"/>
  <!-- face -->
  <ellipse cx="108" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <ellipse cx="132" cy="82" rx="3.8" ry="4.6" fill="#1a1240"/>
  <circle cx="109.3" cy="80.4" r="1.3" fill="#fff"/>
  <circle cx="133.3" cy="80.4" r="1.3" fill="#fff"/>
  <path d="M102 73 q6 -4 12 -1" stroke="#2b1b17" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <path d="M126 72 q6 -3 12 1" stroke="#2b1b17" stroke-width="2.4" stroke-linecap="round" fill="none"/>
  <circle cx="101" cy="93" r="5" fill="#ff7a7a" opacity=".3"/>
  <circle cx="139" cy="93" r="5" fill="#ff7a7a" opacity=".3"/>
  <path d="M110 95 Q120 104 130 95" stroke="#7a2a1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="106" cy="62" rx="9" ry="5" fill="#fff" opacity=".25"/>
</svg>
